# Builder config for Binary B: OTLP HTTP receiver → splunktcpoutexporter
#
# This binary receives OTLP from Binary A and forwards events to the
# Splunk indexer via the native S2S TCP protocol.

dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/splunktcpout-otlp-col
  name: splunktcpout-otlp-col
  description: "E2E binary B: OTLP receiver → splunktcpoutexporter"
  version: 0.0.1-dev
  output_path: ./binB

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.151.1-0.20260501001745-24aecacf1c04

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.151.1-0.20260501001745-24aecacf1c04
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/splunktcpoutexporter v0.0.1
    path: /home/chli/otel/opentelemetry-collector-contrib/exporter/splunktcpoutexporter
