# Binary A runtime config: splunktailreceiver → OTLP HTTP → Binary B
#
# Run:
#   LD_LIBRARY_PATH=/home/chli/main/src/framework_cabi:/home/chli/splunk_home/lib \
#   SPLUNK_HOME=/home/chli/splunk_home \
#   ./binA/splunktail-col --config config-A.yaml
#
# Tail inputs are read from splunkframeworkextension's inputs.conf cache.
# Example stanza:
#   [monitor:///tmp/e2e_fresh_*.log]
#   disabled = 0
#   sourcetype = tailin_e2e
#   index = main

extensions:
  splunkframework:
    splunk_home: /home/chli/splunk_home

receivers:
  splunktail:
    framework: splunkframework

exporters:
  otlphttp:
    endpoint: http://localhost:4318
    tls:
      insecure: true

  debug:
    verbosity: detailed

service:
  extensions: [splunkframework]

  telemetry:
    logs:
      level: info
    metrics:
      level: none

  pipelines:
    logs:
      receivers: [splunktail]
      exporters: [otlphttp, debug]
