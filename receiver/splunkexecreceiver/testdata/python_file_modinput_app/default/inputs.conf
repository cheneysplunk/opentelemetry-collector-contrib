[otel_exec_python_file_input]
run_introspection = true
run_only_one = false
python.required = 3.9

[otel_exec_python_file_input://exec_receiver]
disabled = 0
interval = -1
file_path = ${OTEL_EXEC_TEST_FILE}
rest_url = ${OTEL_EXEC_TEST_REST_URL}
rest_username = admin
rest_password = changeme
rest_owner = nobody
rest_app = system
rest_conf_name = otel_exec_python_file_test
rest_stanza = exec_receiver
rest_key = marker
rest_value = ${OTEL_EXEC_TEST_MARKER}
sourcetype = otel_exec_python_file_input
source = otel_exec_python_file_input_source
host = otel-python-file-host
index = main
start_by_shell = false
