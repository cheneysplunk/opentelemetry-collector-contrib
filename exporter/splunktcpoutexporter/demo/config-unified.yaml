# Unified e2e runtime config: splunktailreceiver → splunktcpoutexporter
#
# Run:
#   LD_LIBRARY_PATH=/home/chli/main/src/framework_cabi:/home/chli/splunk_home/lib \
#   SPLUNK_HOME=/home/chli/splunk_home \
#   ./bin-unified/splunk-col --config config-unified.yaml
#
# Tail inputs are read from splunkframeworkextension's inputs.conf cache.
# Example stanza:
#   [monitor:///tmp/e2e_fresh_*.log]
#   disabled = 0
#   sourcetype = tailin_e2e
#   index = main
#
# Tcp output is read from splunkframeworkextension's outputs.conf cache.
# Example stanza:
#   [tcpout]
#   defaultGroup = primary_indexers
#   [tcpout:primary_indexers]
#   server = indexer.example.com:9997

extensions:
  splunkframework:
    splunk_home: /home/chli/splunk_home

receivers:
  splunktail:
    framework: splunkframework

exporters:
  splunktcpout:
    framework: splunkframework
    output_group: primary_indexers
    index: main
    default_source: /tmp/e2e_fresh_*.log
    default_sourcetype: tailin_e2e
    default_host: ufcompo
    drain_seconds: 5

service:
  extensions: [splunkframework]

  telemetry:
    logs:
      level: info
    metrics:
      level: none

  pipelines:
    logs:
      receivers: [splunktail]
      exporters: [splunktcpout]
