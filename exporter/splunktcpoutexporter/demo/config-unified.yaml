# Unified runtime config: splunktailreceiver → splunktcpoutexporter (single process)
#
# Run:
#   LD_LIBRARY_PATH=/home/chli/main/src/framework_cabi:/home/chli/splunk_home/lib \
#   SPLUNK_HOME=/home/chli/splunk_home \
#   ./bin-unified/splunk-col --config config-unified.yaml

extensions:
  splunkframework:
    splunk_home: /home/chli/splunk_home

receivers:
  splunktail:
    splunk_home: /home/chli/splunk_home
    default_sourcetype: tailin_e2e
    default_index: main
    monitors:
      - glob: /tmp/e2e_fresh_*.log
        sourcetype: tailin_e2e

exporters:
  splunktcpout:
    host: 10.236.40.125
    port: 9997
    index: main
    default_source: /tmp/e2e_fresh_*.log
    default_sourcetype: tailin_e2e
    default_host: ufcompo
    drain_seconds: 5
    splunk_home: /home/chli/splunk_home

  debug:
    verbosity: detailed

service:
  extensions: [splunkframework]

  telemetry:
    logs:
      level: info
    metrics:
      level: none

  pipelines:
    logs:
      receivers: [splunktail]
      exporters: [splunktcpout, debug]
