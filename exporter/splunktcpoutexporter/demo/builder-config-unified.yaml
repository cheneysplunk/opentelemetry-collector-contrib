# Unified e2e builder config: splunkframeworkextension + splunktailreceiver → splunktcpoutexporter
#
# A single binary replaces the old two-process OTLP bridge.
# The extension owns all CGo (splunkfw + tailin + tcpout); the receiver and
# exporter are pure Go and call the extension via splunkapi.SplunkFramework.
#
# Build:
#   cd demo/
#   FW_DIR=/home/chli/main/src/framework_cabi
#   SPLUNK_HOME=/home/chli/splunk_home
#   CGO_LDFLAGS="-L${FW_DIR} -lsplunk_cabi -Wl,-rpath,${FW_DIR} -Wl,-rpath,${SPLUNK_HOME}/lib -lstdc++ -ldl -lpthread" \
#   /home/chli/go/bin/builder --config builder-config-unified.yaml
#
# (CGO_CFLAGS is not needed: all three headers are vendored in the extension
#  package directory and found via `#cgo CFLAGS: -I${SRCDIR}`)
#
# Run:
#   LD_LIBRARY_PATH=/home/chli/main/src/framework_cabi:/home/chli/splunk_home/lib \
#   SPLUNK_HOME=/home/chli/splunk_home \
#   ./bin-unified/splunk-col --config config-unified.yaml

dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/splunk-col
  name: splunk-col
  description: "splunkframeworkextension + splunktailreceiver → splunktcpoutexporter"
  version: 0.0.1-dev
  output_path: ./bin-unified
  cgo_enabled: true

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/splunkframeworkextension v0.0.1
    path: /home/chli/otel/opentelemetry-collector-contrib/extension/splunkframeworkextension

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/splunktailreceiver v0.0.1
    path: /home/chli/otel/opentelemetry-collector-contrib/receiver/splunktailreceiver

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/splunktcpoutexporter v0.0.1
    path: /home/chli/otel/opentelemetry-collector-contrib/exporter/splunktcpoutexporter
