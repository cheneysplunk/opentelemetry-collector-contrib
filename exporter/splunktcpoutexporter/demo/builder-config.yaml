# Builder configuration for ocb (OpenTelemetry Collector Builder)
#
# Produces a minimal custom collector binary:
#   filelog receiver  →  splunktcpout exporter  (+debug exporter for console visibility)
#
# Build steps — see build.sh for the one-liner.

dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/splunktcpout-demo-col
  name: splunktcpout-demo-col
  description: "Demo collector: filelog receiver → Splunk S2S TCP output"
  version: 0.0.1-dev
  output_path: ./bin

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.151.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.151.1-0.20260501001745-24aecacf1c04
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/splunktcpoutexporter v0.0.1
    path: /home/chli/otel/opentelemetry-collector-contrib/exporter/splunktcpoutexporter
